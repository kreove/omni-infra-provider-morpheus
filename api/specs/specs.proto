syntax = "proto3";

package emuspecs;

option go_package = "github.com/kreove/omni-infra-provider-morpheus/api/specs";

// MachineSpec is stored in Omni in the infra provisioner state.
message MachineSpec {
  string uuid = 1;
  string schematic = 2;
  string talos_version = 3;
  // image_id is the Morpheus virtual image the machine was provisioned from.
  string image_id = 4;
  // instance_id is the Morpheus instance ID, resolved once and then reused so
  // deprovisioning does not depend on the instance still being findable by name.
  string instance_id = 5;
}
