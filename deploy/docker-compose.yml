services:
  omni-infra-provider-morpheus:
    image: ${PROVIDER_IMAGE:?PROVIDER_IMAGE is not set}
    container_name: omni-infra-provider-morpheus
    restart: unless-stopped
    env_file:
      - .env
    # Provisioned machines fetch their Talos config from the provider, so this
    # port has to be reachable from the network the VMs are built on. The
    # address machines use is NOCLOUD_SERVER_URL.
    ports:
      - "9080:9080"
    # The provider streams Talos images through its own filesystem on the way
    # into Morpheus. A raw image needs a couple of gigabytes of scratch space;
    # qcow2 needs far less.
    tmpfs:
      - /tmp:size=4g
